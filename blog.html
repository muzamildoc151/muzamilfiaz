<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Muzamil Fiaz</title>
<link rel="stylesheet" href="blog-style.css">
</head>
<body>

<header class="blog-nav">
  <a href="index.html">← Back to Website</a>
  <a href="blog.html">Blog</a>
</header>

<main>
  <section class="blog-intro">
    <p class="eyebrow">MUZAMIL FIAZ</p>
    <h1>My Blog</h1>
    <p>Articles, thoughts, experiences and ideas.</p>
  </section>

  <section id="blog-container" class="blog-grid"></section>
</main>

<footer>
  <p>© 2026 Muzamil Fiaz</p>
</footer>

<script src="blogs.js"></script>
<script>
const container = document.getElementById("blog-container");

if (!blogs.length) {
  container.innerHTML = "<p class='empty'>No blogs published yet.</p>";
} else {
  blogs.forEach(blog => {
    const card = document.createElement("article");
    card.className = "blog-card";

    const image = blog.image
      ? `<img src="${blog.image}" alt="${blog.title}" loading="lazy">`
      : "";

    card.innerHTML = `
      ${image}
      <div class="blog-card-body">
        <span class="blog-category">${blog.category || "Article"}</span>
        <h2>${blog.title}</h2>
        <p class="blog-date">${blog.date}</p>
        <p>${blog.description}</p>
        <a href="${blog.link}" class="read-more">Read Article →</a>
      </div>
    `;

    container.appendChild(card);
  });
}
</script>
</body>
</html>
